[build-system]
requires = [
  "setuptools==69.5.1",
  "setuptools-scm==7.1.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
# To change to eager, or something similar
name = "ttnn"
authors = [
    {name = "Tenstorrent"},
    {email = "info@tenstorrent.com"},
]
dependencies = [
  "pyyaml>=5.4",
  "numpy>=1.24.4,<2",
  "loguru==0.6.0",
  "toolz==0.12.0",
  "matplotlib==3.7.1",
  "Pillow==10.3.0",
  "jupyterlab==4.2.5",
  "ipywidgets==8.1.1",

  # extra index required https://download.pytorch.org/whl/cpu
  "torch==2.2.1+cpu",
  "networkx==3.1",
  "graphviz==0.20.3",
  "bokeh==3.1.1",

  # profiler
  "click==8.1.7",
  "dash==2.15.0",
  "pandas==2.0.3",
  "plotly==5.18.0",
  "seaborn==0.13.2",
]
requires-python = ">=3.8"
description = "General compute framework for Tenstorrent devices"
dynamic = ["version"]

[dependency-groups]
dev = [
    "accelerate==0.27.2",
    "beautifultable>=1.1.0",
    "bert-score==0.3.12",
    "black==24.3.0",
    "blobfile==2.1.1",
    "breathe==4.35.0",
    "build==0.10.0",
    "clang-format==19.1.4",
    "datasets==2.9.0",
    "diffusers==0.32.2",
    "docopt==0.6.2",
    "docutils==0.18.1",
    "einops==0.6.1",
    "elasticsearch>=8.17.2",
    "enlighten==1.12.4",
    "evaluate==0.4.0",
    "faster-fifo>=1.4.7",
    "fiftyone==0.25.2",
    "fsspec==2023.9.2",
    "ftfy==6.1.1",
    "gitpython==3.1.41",
    "huggingface-hub==0.25.2",
    "ipython==8.12.3",
    "jiwer==3.0.5",
    "jsbeautifier==1.14.7",
    "librosa==0.10.0",
    "llama-models; python_version >= '3.12'",
    "loguru>=0.6.0",
    "lxml==4.9.4",
    "multiprocess==0.70.14",
    "mypy==1.9.0",
    "myst-parser==3.0.0",
    "nbsphinx==0.9.3",
    "networkx==3.1",
    "numba>=0.58.1",
    "numpy>=1.24.4,<2",
    "opencv-python-headless==4.8.1.78",
    "pandoc==2.3",
    "platformdirs<4.0.0",
    "pre-commit==3.0.4",
    "pydantic==2.9.2",
    "pytest-github-actions-annotate-failures==0.3.0",
    "pytest-split==0.8.2",
    "pytest-timeout==2.2.0",
    "pytest-xdist==3.6.1",
    "pytest==7.2.2",
    "sentencepiece==0.1.97",
    "sphinx-rtd-theme==1.3.0",
    "sphinx==7.1.2",
    "sphinxcontrib-email==0.3.5",
    "sphinxcontrib-jquery==4.1",
    "tabulate==0.9.0",
    "termcolor>=2.4.0",
    "tiktoken==0.3.3",
    "timm==0.6.13",
    "torch-fidelity==0.3.0",
    "torch==2.2.1.0+cpu",
    "torchmetrics==1.3.1",
    "torchvision==0.17.1+cpu",
    "tqdm==4.66.3",
    "transformers==4.38.0",
    "twine==4.0.2",
    "xlsxwriter==3.0.8",
    "yamllint==1.32.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
llama-models = { git = "https://github.com/tenstorrent/llama-models.git", rev = "tt_metal_tag" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.black]
line-length = 120
include = '^.*(ttnn|tests/scripts|tests/ttnn|tests/tt_eager/python_api_testing|tt_eager/tt_lib|tests/scripts|models/demos|infra|.github)/.*\.py$'

[tool.ruff]
line-length = 120
